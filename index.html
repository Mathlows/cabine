<script>
const {html, render, useState, useEffect, useMemo, useRef} = htmPreact;

/* ---------------- utilitaires ---------------- */
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
const r2 = n => Math.round((Number(n)||0)*100)/100;
const eur = n => (Number(n)||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'}).replace(/[  ]/g,' ');
const todayISO = () => { const d=new Date(); return iso(d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseISO = s => { const [y,m,d]=(s||'').split('-').map(Number); return new Date(y,(m||1)-1,d||1); };

let sb=null;
async function initSupabase(cfg){

async function initStore(){

  }catch(e){ db=null; }

    const root = db.doc(`data/users/${id}/app`);
    const refs = {}; const loaded = new Set();
    await new Promise(res=>{
      const t = setTimeout(()=>{ backend.note='Vos données mettent du temps à arriver. Elles s’afficheront dès que la connexion répond.'; res(); }, 10000);
      COLS.forEach(c=>{

        refs[c].onSnapshot(snap=>{
          S[c] = snap.docs.map(d=>({...d.data(), id:d.id}));

          emit();
        }, err=>{ backend.note='La synchronisation s’est interrompue ('+err.code+'). Rechargez la page.'; emit(); if(!loaded.has(c)){ loaded.add(c); if(loaded.size===COLS.length){clearTimeout(t);res();} } });
      });
    });
    backend.mode='cloud';
    backend.put = async (c,o)=>{ const {id:_i,...body}=o; await refs[c].doc(o.id).set(clone(body)); };
    backend.del = async (c,i)=>{ await refs[c].doc(i).delete(); };
  } else {
    const raw = lsGet(LS_KEY);
    if(raw){ try{ Object.assign(S, JSON.parse(raw)); }catch(e){} }
    const save = ()=>lsSet(LS_KEY, JSON.stringify(S));
    backend.mode='local';
    backend.put = async ()=>save(); backend.del = async ()=>save();
    backend.note = db===null && window.claude ? 'Connectez-vous à claude.ai pour que vos données soient sauvegardées dans le cloud. Pour l’instant elles restent sur cet appareil.' : '';
  }
}

/* À chaque ouverture : envoie à Google les dates qui n'y sont pas encore, puis récupère les nouveautés. */
async function syncOnOpen(){

let pulling=false;
async function pullGoogle(){
  if(!googleOn() || pulling) return; pulling=true; let created=0;
  try{
    const r = await gcall('pull',{since:settings().lastPull});
    for(const g of r.items||[]){
      const local = S.events.find(e=>e.googleId===g.googleId || (g.cabineId && e.id===g.cabineId));
      if(g.status==='cancelled'){
        if(local){ await detachEventInvoice(local); await del('events',local.id,{noSync:true}); }
        continue;
      }
      const st=parisParts(g.start,g.allDay), en=parisParts(g.end,g.allDay);
      if(local){
        const upd={...local, googleId:g.googleId, date:st.date, start:g.allDay?local.start:st.time, end:g.allDay?local.end:en.time};
        if(upd.date!==local.date || upd.start!==local.start || upd.end!==local.end || upd.googleId!==local.googleId){
          await put('events',upd,{noSync:true});
          const inv=S.docs.find(d=>d.id===local.invoiceId); if(inv && inv.status==='brouillon' && upd.date!==local.date){ if(inv.monthly){ await detachEventInvoice(local); const re=await attachEventInvoice({...upd, invoiceId:''}); await put('events',re,{noSync:true}); } else await put('docs',{...inv, eventDate:upd.date}); }
        }
      } else if(!g.cabineId){
        const isRdv=/^rdv\b/i.test(g.summary); const parts=g.summary.replace(/^rdv\s*[·:-]?\s*/i,'').split(' · ').map(x=>x.trim());
        const client=S.clients.find(c=>parts.some(x=>x && clientName(c).toLowerCase()===x.toLowerCase())) || matchClient(g.summary+' '+(g.location||''));
        const rest=parts.filter(x=>x && !(client && matchClient(x)?.id===client.id));
        const place = isRdv ? g.location : placeFor(client, rest.join(' ') || g.summary, g.location);
        const ev={id:uid(), kind:isRdv?'rdv':'presta', profileId:activeProfile()?.id||'', clientId:client?.id||'', date:st.date, start:g.allDay?'20:00':st.time, end:g.allDay?'02:00':en.time, eventType:'', location:place||'', notes:g.description||'', googleId:g.googleId, invoiceId:'', fromGoogle:true, googleTitle:g.summary, googleLocation:g.location||''};
        if(!isRdv){ const inv=draftFromEvent(ev); ev.invoiceId=inv.id; await put('docs',inv); }
        await put('events',ev);
        created++;
      }
    }
    const linked=await rematchGoogleEvents();
    await saveSettings({lastPull:r.now}); backend.lastSync=new Date(); emit();
    if(created) toast(created+(created>1?' dates ajoutées':' date ajoutée')+' depuis Google Agenda');
    else if(linked) toast(linked+(linked>1?' dates rattachées à leur client':' date rattachée à son client'));
  }catch(err){ console.warn('Google Agenda', err); }
  pulling=false;
}
function useStore(){ const [,set]=useState(0); useEffect(()=>{ const f=()=>set(v=>v+1); subs.add(f); return ()=>subs.delete(f); },[]); return S; }

/* ---------------- toast ---------------- */
let toastSet=null;

function Toast(){ const [m,setM]=useState(''); useEffect(()=>{ toastSet=(x)=>{ setM(x); clearTimeout(Toast.t); Toast.t=setTimeout(()=>setM(''),3200); }; },[]); return m ? html`<div class="toast" role="status">${m}</div>` : null; }

/* ---------------- profil actif ---------------- */
let currentProfileId = lsGet('cabine-profile') || '';
function activeProfile(){ return S.profiles.find(p=>p.id===currentProfileId) || S.profiles[0] || null; }
function setActiveProfile(id){ currentProfileId=id; lsSet('cabine-profile',id); emit(); }
const vatOn = p => p && p.vatMode==='tva';

/* ---------------- métier : clients, totaux, numérotation ---------------- */
function clientName(c){ if(!c) return 'Client supprimé'; return c.kind==='entreprise' ? (c.company||'Entreprise sans nom') : ([c.firstName,c.lastName].filter(Boolean).join(' ')||'Client sans nom'); }
function clientById(id){ return S.clients.find(c=>c.id===id); }
function docClient(d){ return d.clientSnapshot || clientById(d.clientId); }
function docProfile(d){ return d.sellerSnapshot || S.profiles.find(p=>p.id===d.profileId); }
function computeTotals(d, p){
  const tva = vatOn(p);
  let ht=0; const vats={};
  const bases={};
  (d.lines||[]).forEach(l=>{ const t=lineTotal(l); ht+=t; if(tva){ const rate=Number(l.vat)||0; bases[rate]=(bases[rate]||0)+t; } });
  ht=r2(ht);
  // remise générale en % sur l'ensemble du document
  const pct = Math.min(100, Math.max(0, Number(d.remisePct)||0));
  const gross = ht; const remise = r2(gross*pct/100);
  if(pct) ht = r2(gross-remise);
  Object.keys(bases).forEach(k=>{ const b=r2(bases[k]) - r2(r2(bases[k])*pct/100); vats[k]=r2(b*Number(k)/100); });
  const vat = r2(Object.values(vats).reduce((a,b)=>a+b,0));
  const ttc = r2(ht+vat); const deposit=r2(d.deposit||0);
  return {ht, gross, pct, remise, vats, vat, ttc, deposit, due:r2(ttc-deposit), tva};
}
const DOC_LABEL = {facture:'Facture', devis:'Devis', avoir:'Avoir'};
/* Montant TTC déjà crédité par des avoirs émis sur une facture */
function creditedAmount(inv){ return r2(S.docs.filter(a=>a.type==='avoir' && a.number && a.creditOf===inv.id && a.status!=='annulee').reduce((s,a)=>s+computeTotals(a,docProfile(a)).ttc,0)); }
const fullyCredited = inv => inv.type==='facture' && inv.number && creditedAmount(inv) >= computeTotals(inv,docProfile(inv)).ttc - 0.005;
/* Reste dû sur une facture, avoirs déduits */
const dueOf = inv => r2(Math.max(0, computeTotals(inv,docProfile(inv)).due - creditedAmount(inv)));
function docState(d){
  if(d.type==='avoir'){
    if(d.status==='brouillon') return {k:'draft',l:'Brouillon'};
    if(d.status==='annulee') return {k:'',l:'Annulé'};
    return {k:'paid',l:'Avoir émis'};
  }
  if(d.type==='facture'){
    if(d.status==='brouillon') return {k:'draft',l:'Brouillon'};
    if(d.status==='annulee') return {k:'',l:'Annulée'};
    if(fullyCredited(d)) return {k:'',l:'Annulée par avoir'};
    if(d.status==='payee') return {k:'paid',l:'Payée'};
    if(d.dueDate && d.dueDate < todayISO()) return {k:'late',l:'En retard'};
    return {k:'due',l:'À encaisser'};
  }
  if(d.status==='brouillon') return {k:'draft',l:'Brouillon'};
  if(d.status==='accepte') return {k:'accepted',l:'Accepté'};
  if(d.status==='refuse') return {k:'refused',l:'Refusé'};
  if(d.status==='facture') return {k:'paid',l:'Facturé'};

}
function lineTotal(l){ const g=(Number(l.qty)||0)*(Number(l.unit)||0); const ds=Number(l.disc)||0; return r2(l.discKind==='€' ? g-ds : g*(1-ds/100)); }
function numberFormatOf(p,type){
  if(type==='avoir'){ if(p?.creditFormat) return p.creditFormat; const f=p?.numberFormat || `${p?.invoicePrefix||'F'}-{AAAA}-{NNNN}`; return /^[A-Za-z]+/.test(f) ? f.replace(/^[A-Za-z]+/,'A') : 'A-'+f; }
  return type==='facture' ? (p?.numberFormat || `${p?.invoicePrefix||'F'}-{AAAA}-{NNNN}`) : (p?.quoteFormat || `${p?.quotePrefix||'D'}-{AAAA}-{NNNN}`);
}
/* Prépare un avoir (brouillon) sur une facture numérotée : total par défaut, modifiable pour un avoir partiel. */
function newAvoir(inv){
  const restant = r2(computeTotals(inv,docProfile(inv)).ttc - creditedAmount(inv));
  const total = restant >= computeTotals(inv,docProfile(inv)).ttc - 0.005;
  return newDoc('avoir', {profileId:inv.profileId, clientId:inv.clientId, creditOf:inv.id, creditOfNumber:inv.number, creditOfDate:inv.issueDate,
    lines: total ? clone(inv.lines||[]).map(l=>({...l, id:uid()})) : [{id:uid(), title:'Avoir partiel sur la facture '+inv.number, description:'', qty:1, unit:restant, vat:0, disc:0, discKind:'%'}],
    remisePct: total ? (inv.remisePct||0) : 0, eventDate:inv.eventDate||'', eventLocation:inv.eventLocation||'', eventType:inv.eventType||'', reason:''});
}
function periodOf(fmt,date){ return fmt.includes('{MM}') ? date.slice(0,7) : date.slice(0,4); }
function fmtNumber(fmt,date,seq){ const y=date.slice(0,4), m=date.slice(5,7); return fmt.replace('{AAAA}',y).replace('{AA}',y.slice(2)).replace('{MM}',m).replace(/\{(N+)\}/,(_,n)=>String(seq).padStart(n.length,'0')); }
function nextNumber(d){
  const p = S.profiles.find(x=>x.id===d.profileId);
  const fmt = numberFormatOf(p, d.type);
  const date = d.issueDate||todayISO(); const per = periodOf(fmt,date);
  let max=0;
  S.docs.forEach(x=>{ if(x.profileId===d.profileId && x.type===d.type && x.number && (x.seqPeriod||x.seqYear)===per) max=Math.max(max, x.seq||0); });

}
function dueFrom(issue,p){ const n=Number(p?.paymentDays??30); let d=addDays(issue,n); if(p?.paymentRule==='fdm'){ const x=parseISO(d); d=iso(new Date(x.getFullYear(), x.getMonth()+1, 0)); } return d; }
function termsLabel(p){ const n=Number(p?.paymentDays??30); if(!n) return 'À réception'; return p?.paymentRule==='fdm' ? `${n} jours fin de mois` : `${n} jours`; }
const DATE_RE = /\b(\d{1,2})\/(\d{1,2})\/(\d{4})\b/g;
function shortDate(s){ const d=parseISO(s); return `${d.getDate()}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; }
/* reprend les lignes d'une ancienne facture en remplaçant les anciennes dates par la nouvelle */
function refreshLines(lines, date, location){
  return clone(lines||[]).map(l=>{
    const nl={...l, id:uid()};
    const all=(l.title+'\n'+(l.description||'')).match(DATE_RE)||[];
    if(date && all.length){
      let first=true; const rep = txt => (txt||'').replace(DATE_RE, ()=>{ if(first){ first=false; return shortDate(date); } return '\u0000'; });
      nl.title = rep(l.title).replace(/\s*\u0000\s*(et|,)?\s*/g,' ').trim();
      nl.description = rep(l.description).split('\n').filter(x=>x.replace(/[\u0000\s,]/g,'')!=='').map(x=>x.replace(/\s*(et|,)?\s*\u0000/g,'').trim()).join('\n');
      if(Number(l.qty)===all.length && all.length>1) nl.qty=1;
      if(location) { nl.title=nl.title.replace(/^([^\n:]{3,40}):(\s*\d)/, location+':$2'); nl.description=nl.description.replace(/^([^\n:]{3,40}):(\s*\d)/m, location+':$2'); }
    }
    return nl;
  });
}

function draftFromEvent(ev){
  const p = S.profiles.find(x=>x.id===ev.profileId) || activeProfile();

/* ---------------- facturation mensuelle : toutes les dates du mois sur une seule facture ---------------- */
const monthKey = date => (date||'').slice(0,7);
const monthLabel = m => m ? MONTHS[Number(m.slice(5,7))-1]+' '+m.slice(0,4) : '';
const baseTitle = t => String(t||'').replace(DATE_RE,'').replace(/\b\d{1,2}\/\d{1,2}\b/g,'').replace(/\s{2,}/g,' ').replace(/[\s:·,–-]+$/,'').trim();
function monthlyDraftFor(clientId, month){ return S.docs.find(d=>d.type==='facture' && d.status==='brouillon' && d.monthly && d.clientId===clientId && d.billingMonth===month); }
/* Ligne type d'une prestation : la première ligne d'une facture (sans ses dates) */
function lineTemplate(inv, fallbackClientId, profileId){
  const src = inv?.lines?.[0] && Number(inv.lines[0].unit)>0 ? inv : lastInvoiceForClient(fallbackClientId, profileId);
  const l = src?.lines?.[0];
  if(!l) return {title:'Prestation DJ', unit:0, vat:0, qunit:'', disc:0, discKind:'%', qty:1};
  const dates=((l.title||'')+'\n'+(l.description||'')).match(DATE_RE)||[];
  const perEvent = dates.length>1 && Number(l.qty)===dates.length ? 1 : (dates.length ? 1 : (Number(l.qty)||1));
  return {title:baseTitle(l.title)||'Prestation DJ', unit:Number(l.unit)||0, vat:Number(l.vat)||0, qunit:l.qunit||'', disc:Number(l.disc)||0, discKind:l.discKind||'%', qty:perEvent};
}
function renderMonthlyLine(l){
  const evs=(l.events||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const places=new Set(evs.map(e=>e.place||''));
  return {...l, qty: evs.reduce((s,e)=>s+(Number(e.qty)||1),0), description: evs.map(e=>shortDate(e.date)+(places.size>1 && e.place?' – '+e.place:'')).join('\n')};
}
function finishMonthly(dr){
  const evs=(dr.lines||[]).flatMap(l=>l.events||[]).sort((a,b)=>a.date.localeCompare(b.date));
  const places=[...new Set(evs.map(e=>e.place||'').filter(Boolean))];
  return {...dr, eventDate: evs.length ? evs[evs.length-1].date : '', eventLocation: places.length===1 ? places[0] : '', monthCount: new Set(evs.map(e=>e.id)).size};
}
function addEventToMonthly(dr, ev, tpl){
  let lines=clone(dr.lines||[]).map(l=>l.monthlyKey?{...l, events:(l.events||[]).filter(e=>e.id!==ev.id)}:l);
  const key=norm(tpl.title)+'|'+tpl.unit+'|'+tpl.vat;
  let l=lines.find(x=>x.monthlyKey===key);
  if(!l){ l={id:uid(), title:tpl.title, unit:tpl.unit, vat:tpl.vat, qunit:tpl.qunit, disc:tpl.disc, discKind:tpl.discKind, monthlyKey:key, events:[]}; lines.push(l); }
  l.events.push({id:ev.id, date:ev.date, qty:tpl.qty||1, place:ev.location||''});
  lines=lines.filter(x=>!x.monthlyKey || x.events.length).map(x=>x.monthlyKey?renderMonthlyLine(x):x);
  return finishMonthly({...dr, lines});
}
function removeEventFromMonthly(dr, evId){
  const lines=clone(dr.lines||[]).map(l=>l.monthlyKey?{...l, events:(l.events||[]).filter(e=>e.id!==evId)}:l).filter(l=>!l.monthlyKey || l.events.length).map(l=>l.monthlyKey?renderMonthlyLine(l):l);
  return finishMonthly({...dr, lines});
}
/* Une date quitte sa facture provisoire (suppression, changement de mois ou de client) */
async function detachEventInvoice(ev){
  const inv=S.docs.find(d=>d.id===ev.invoiceId); if(!inv || inv.number) return;
  if(inv.monthly){ const upd=removeEventFromMonthly(inv, ev.id); if(upd.monthCount) await put('docs',upd); else await del('docs',inv.id); }
  else await del('docs',inv.id);
}
/* Rattache une date à la bonne facture provisoire et renvoie la date mise à jour */
async function attachEventInvoice(ev){
  const inv=draftFromEvent(ev); await put('docs',inv); return {...ev, invoiceId:inv.id};
}
function MonthBillSheet({clientId, onClose}){
  useStore(); const c=clientById(clientId);
  const months=[...new Set(S.events.filter(e=>e.clientId===clientId && e.kind!=='rdv').map(e=>monthKey(e.date)))].sort();
  const pending=months.filter(m=>S.events.some(e=>e.clientId===clientId && e.kind!=='rdv' && monthKey(e.date)===m && !S.docs.find(d=>d.id===e.invoiceId)?.number));
  const [month,setMonth]=useState(()=>pending.filter(m=>m<=monthKey(todayISO())).pop() || pending[0] || monthKey(todayISO()));
  const [auto,setAuto]=useState(c?.monthlyBilling ?? true); const [busy,setBusy]=useState(false);
  const evs=S.events.filter(e=>e.clientId===clientId && e.kind!=='rdv' && monthKey(e.date)===month).sort((a,b)=>a.date.localeCompare(b.date));
  const info=e=>{ const inv=S.docs.find(d=>d.id===e.invoiceId); if(inv?.number) return {ok:false, l:'déjà facturée ('+inv.number+')'}; if(inv?.monthly) return {ok:false, l:'déjà dans la facture du mois'}; if(inv) return {ok:true, l:'facture provisoire '+eur(computeTotals(inv,docProfile(inv)).ttc)}; return {ok:true, l:'sans facture'}; };
  const [sel,setSel]=useState({}); const isSel=e=>sel[e.id]!==false;
  const chosen=evs.filter(e=>info(e).ok && isSel(e));
  const shift=n=>{ const d=new Date(Number(month.slice(0,4)), Number(month.slice(5,7))-1+n, 1); setMonth(iso(d).slice(0,7)); setSel({}); };
  async function go(){
    if(!chosen.length) return; setBusy(true);
    const prev=lastInvoiceForClient(clientId);
    let dr=monthlyDraftFor(clientId, month) || newDoc('facture',{profileId:chosen[0].profileId||activeProfile()?.id||'', clientId, monthly:true, billingMonth:month, lines:[], notes:prev?.notes||'', remisePct:prev?.remisePct||0});
    for(const e of chosen){ const own=S.docs.find(d=>d.id===e.invoiceId && !d.number && !d.monthly); dr=addEventToMonthly(dr, e, lineTemplate(own, clientId, dr.profileId)); if(own) await del('docs', own.id); }
    await put('docs', dr);
    for(const e of chosen) await put('events', {...S.events.find(x=>x.id===e.id), invoiceId:dr.id}, {noSync:true});
    if(auto!==!!c.monthlyBilling) await put('clients', {...c, monthlyBilling:auto});
    toast(`Facture de ${monthLabel(month)} préparée : ${chosen.length} date${chosen.length>1?'s':''}`); onClose(); open('doc',{doc:S.docs.find(d=>d.id===dr.id)||dr});
  }
  return html`<${Sheet} title=${'Facturer le mois · '+clientName(c)} onClose=${onClose} actions=${html`<button class="btn pri sm" disabled=${busy||!chosen.length} onClick=${go}>Préparer la facture</button>`}>
    <div class="row sb"><button class="btn sm" onClick=${()=>shift(-1)} aria-label="Mois précédent">‹</button><h2 style="text-transform:capitalize">${monthLabel(month)}</h2><button class="btn sm" onClick=${()=>shift(1)} aria-label="Mois suivant">›</button></div>
    ${evs.length ? html`<div class="list">${evs.map(e=>{ const i=info(e); return html`<label class="item" style=${i.ok?'cursor:pointer':'opacity:.6'}><input type="checkbox" disabled=${!i.ok} checked=${i.ok && isSel(e)} onChange=${x=>setSel(s=>({...s,[e.id]:x.target.checked}))} style="width:18px;height:18px;accent-color:var(--accent)"/>
      <div class="datechip" style=${`box-shadow:inset 3px 0 0 ${eventColor(e)}`}><b>${parseISO(e.date).getDate()}</b><span>${MSHORT[parseISO(e.date).getMonth()]}</span></div>
      <div class="grow"><div class="t">${e.location||evLabel(e)}${e.start?' · '+e.start:''}</div><div class="tiny">${i.l}</div></div></label>`; })}</div>`
      : html`<div class="card empty"><h3>Aucune date en ${monthLabel(month)}</h3><p>Changez de mois avec les flèches.</p></div>`}
    ${chosen.length>0 && html`<div class="notice small">Les ${chosen.length} date${chosen.length>1?'s':''} cochée${chosen.length>1?'s':''} seront regroupées sur une seule facture provisoire, une ligne par tarif avec la liste des dates. Leurs factures provisoires séparées seront remplacées.</div>`}
    <label class="check"><input type="checkbox" checked=${auto} onChange=${e=>setAuto(e.target.checked)}/><span>Désormais, regrouper automatiquement les dates de ${clientName(c)} chaque mois<br/><span class="tiny">Chaque nouvelle date (Cabine ou Google Agenda) s’ajoutera à la facture provisoire de son mois.</span></span></label>
  <//>`;

/* ---------------- recherche entreprise (annuaire officiel) ---------------- */
const NATURE = {'1000':'Entrepreneur individuel','5499':'SARL','5498':'EURL','5710':'SAS','5720':'SASU','5599':'SA','5308':'SNC','6540':'SCI','9220':'Association','9210':'Association','7210':'Commune'};
function tvaFromSiren(s){ if(!/^\d{9}$/.test(s||'')) return ''; const k=(12+3*(Number(s)%97))%97; return 'FR'+String(k).padStart(2,'0')+s; }
async function searchCompany(q){
  let query = q.trim();
  const m = query.match(/(\d{9})(?:\.html)?\/?$/) || query.replace(/\s/g,'').match(/^(\d{9})(\d{5})?$/);
  if(/societe\.com|pappers|annuaire-entreprises/.test(query) && m) query=m[1];
  else if(m) query=m[1];
  const r = await fetch(`https://recherche-entreprises.api.gouv.fr/search?q=${encodeURIComponent(query)}&per_page=8`);
  if(!r.ok) throw new Error('http '+r.status);
  const j = await r.json();
  return (j.results||[]).map(e=>{ const s=e.siege||{};
    const street=[s.numero_voie,s.indice_repetition,s.type_voie,s.libelle_voie].filter(Boolean).join(' ');
    return {company:e.nom_complet||e.nom_raison_sociale||'', siren:e.siren||'', siret:s.siret||'', address: street || (s.adresse||''), cp:s.code_postal||'', city:s.libelle_commune||'', legalForm: NATURE[e.nature_juridique]||'', tva: tvaFromSiren(e.siren), ape:e.activite_principale||'', closed: e.etat_administratif==='C'}; });
}

/* ---------------- PDF ---------------- */
function pdfFor(d, opts){
  const {jsPDF} = window.jspdf;
  const pdf = new jsPDF({unit:'mm', format:'a4'});

  const p = docProfile(d) || {}; const c = docClient(d) || {}; const t = computeTotals(d,p);
  const W=210, H=297, M=16; const ink=[21,26,43], grey=[105,111,130], soft=[244,245,248];
  const color = hexToRgb(p.color||'#3046c9');
  const isInv = d.type==='facture', isAv = d.type==='avoir'; const draft = d.status==='brouillon';
  const docLabel = (DOC_LABEL[d.type]||'Facture') + (d.number ? ' '+d.number : ' (brouillon)');

  let y=M;

  pdf.setTextColor(...color); pdf.setFont(FN,'bold'); pdf.setFontSize(20); pdf.text(docLabel, M, y+6);
  pdf.setTextColor(...ink); pdf.setFont(FN,'normal'); pdf.setFontSize(10);

  if(!isInv && !isAv && d.validUntil) sub.push('Valable jusqu’au '+fdate(d.validUntil));
  if(isAv && d.creditOfNumber) sub.push(`Avoir sur la facture ${d.creditOfNumber}${d.creditOfDate?' du '+fdate(d.creditOfDate):''}`);
  pdf.text(sub, M, y+12);
  y += 12 + sub.length*4.6 + 6;
  // émetteur / destinataire
  const colW = (W-2*M-8)/2, lx=M, rx=M+colW+8, labW=33;
  const sellerRows = [];
  const sName = p.tradeName || p.ownerName || '';
  sellerRows.push(['Société', sName]);
  if(p.ownerName) sellerRows.push([isCompany(p.status)?'Représentant':'Votre contact', p.ownerName.toUpperCase()+(micro?' (EI)':'')]);
  if(isCompany(p.status)) sellerRows.push(['Forme', STATUSES[p.status]+(p.capital?' au capital de '+eur(p.capital):'')]);
  if(p.address||p.cp||p.city) sellerRows.push(['Adresse', [p.address, `${p.cp||''} ${p.city||''}`.trim()].filter(Boolean).join('\n')]);
  if(p.country) sellerRows.push(['Pays', p.country]);
  if(p.siret) sellerRows.push(['N° SIRET', p.siret]); else if(p.siren) sellerRows.push(['N° SIREN', p.siren]);
  if(isCompany(p.status) && p.rcs) sellerRows.push(['RCS', p.rcs]);
  if(p.ape) sellerRows.push(['Code d’activité', p.ape]);
  if(p.tvaNumber && (vatOn(p) || p.showTva)) sellerRows.push(['Numéro de TVA', p.tvaNumber]);
  if(p.phone) sellerRows.push(['Téléphone', p.phone]);
  if(p.email) sellerRows.push(['E-mail', p.email]);
  const ent = c.kind==='entreprise';
  const clientRows = [];
  clientRows.push([ent?'Société':'Nom', clientName(c)]);
  if(ent && c.contact) clientRows.push(['Contact', c.contact]);
  if(c.address||c.cp||c.city) clientRows.push(['Adresse', [c.address, `${c.cp||''} ${c.city||''}`.trim()].filter(Boolean).join('\n')]);
  if(c.country) clientRows.push(['Pays', c.country]);
  if(ent && (c.siret||c.siren)) clientRows.push(['N° d’entreprise', c.siret||c.siren]);
  if(ent && c.ape) clientRows.push(['Code d’activité', c.ape]);
  if(ent && c.tva) clientRows.push(['Numéro de TVA', c.tva]);
  if(c.email) clientRows.push(['E-mail', c.email]);
  function block(x, title, rows){
    let yy=y; pdf.setFont(FN,'bold'); pdf.setFontSize(10.5); pdf.setTextColor(...color); pdf.text(title, x, yy); yy+=2;
    pdf.setDrawColor(...color); pdf.setLineWidth(.4); pdf.line(x, yy, x+colW, yy); yy+=5;
    pdf.setFontSize(8.8);
    rows.forEach(([k,v])=>{ pdf.setFont(FN,'normal'); pdf.setTextColor(...grey); pdf.text(k+' :', x, yy);
      pdf.setTextColor(...ink); if(k==='Société'||k==='Nom') pdf.setFont(FN,'bold');
      const lines = pdf.splitTextToSize(String(v), colW-labW); pdf.text(lines, x+labW, yy); yy += lines.length*3.9+0.9; });
    return yy;
  }
  const yA = block(lx, 'Émetteur', sellerRows), yB = block(rx, 'Destinataire', clientRows);
  y = Math.max(yA,yB) + 5;
  // prestation
  if(d.eventDate || d.eventType || d.eventLocation){
    const pl=[]; if(d.monthly) pl.push(`Prestations de ${monthLabel(d.billingMonth)} (${d.monthCount||0} date${(d.monthCount||0)>1?'s':''})`); else if(d.eventDate) pl.push('Date : '+fdateLong(d.eventDate)); if(d.eventType) pl.push(d.eventType); if(d.eventLocation) pl.push('Lieu : '+d.eventLocation);
    pdf.setFillColor(...soft); pdf.roundedRect(M, y, W-2*M, 9, 1.5, 1.5, 'F');
    pdf.setFont(FN,'bold'); pdf.setFontSize(8.5); pdf.setTextColor(...grey); pdf.text('PRESTATION', M+4, y+5.8);
    pdf.setFont(FN,'normal'); pdf.setFontSize(9.5); pdf.setTextColor(...ink); pdf.text(pdf.splitTextToSize(pl.join('   ·   '), W-2*M-34)[0], M+28, y+5.8);
    y += 14;
  }
  // détail
  pdf.setFont(FN,'bold'); pdf.setFontSize(10.5); pdf.setTextColor(...color); pdf.text('Détail', M, y); y+=3;
  const hasDisc = (d.lines||[]).some(l=>Number(l.disc));
  const cols = ['Description', t.tva?'Prix unit. HT':'Prix unitaire', 'Quantité'];
  if(hasDisc) cols.push('Réduction'); if(t.tva) cols.push('TVA'); cols.push(t.tva?'Total HT':'Total');
  const money = v => { const n=Number(v)||0; return (Math.round(n*100)!==n*100 ? n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:4}).replace(/[  ]/g,' ')+' €' : eur(n)); };
  const body = (d.lines||[]).map(l=>{ const row=[l.title + (l.description ? '\n'+l.description : ''), money(l.unit), String(l.qty).replace('.',',')+(l.qunit?' '+l.qunit:'')];
    if(hasDisc) row.push(Number(l.disc) ? (l.discKind==='€' ? eur(l.disc) : String(l.disc).replace('.',',')+' %') : '');
    if(t.tva) row.push((Number(l.vat)||0).toString().replace('.',',')+' %'); row.push(eur(lineTotal(l))); return row; });
  const cs = {0:{cellWidth:'auto'}}; for(let i=1;i<cols.length;i++) cs[i]={halign:'right', cellWidth: i===cols.length-1?27:(cols[i]==='TVA'?14:24)};
  pdf.autoTable({startY:y, head:[cols], body, margin:{left:M,right:M, bottom:22}, theme:'plain',
    styles:{font:FN, fontSize:9.2, textColor:ink, cellPadding:{top:2.6,bottom:2.6,left:2.2,right:2.2}, lineColor:[222,225,233], lineWidth:{bottom:.2}},
    headStyles:{fillColor:color, textColor:[255,255,255], fontStyle:'bold', fontSize:8.5},
    columnStyles: cs,
    didParseCell: h=>{ if(h.section==='head' && h.column.index>0) h.cell.styles.halign='right'; },
  });
  y = pdf.lastAutoTable.finalY + 7;
  // totaux
  const tl=[];
  if(t.pct){ tl.push([t.tva?'Total HT avant remise':'Total', eur(t.gross)]); tl.push([`Remise générale (${String(t.pct).replace('.',',')} %)`, '- '+eur(t.remise)]); }
  if(t.tva){ tl.push(['Total HT', eur(t.ht)]); Object.keys(t.vats).sort().forEach(k=>tl.push([`TVA ${k.replace('.',',')} %`, eur(t.vats[k])])); tl.push(['Total TTC', eur(t.ttc), true]); }
  else tl.push([isAv?'Total de l’avoir':(t.pct?'Total final':'Total'), eur(t.ttc), true]);
  if(isAv && t.tva) tl[tl.length-1][0]='Total de l’avoir TTC';
  if(isInv && t.deposit>0){ tl.push(['Acompte déjà versé', '- '+eur(t.deposit)]); tl.push(['Reste à payer', eur(t.due), true]); }
  if(y + tl.length*6.5 + 12 > H-22){ pdf.addPage(); y=M; }
  const yTot=y;
  tl.forEach(([a,b,bold])=>{ pdf.setFont(FN, bold?'bold':'normal'); pdf.setFontSize(bold?11:9.5); pdf.setTextColor(...ink); pdf.text(a, 122, y); pdf.text(b, W-M, y, {align:'right'}); y+= bold?6.5:5.2; });
  pdf.setFont(FN,'normal'); pdf.setFontSize(8.5); pdf.setTextColor(...grey);
  if(!t.tva){ pdf.text('TVA non applicable, art. 293 B du CGI', W-M, y, {align:'right'}); y+=5; }
  if(p.saleType){ pdf.setTextColor(...ink); pdf.setFontSize(9); pdf.text('Type de vente : '+p.saleType, M, yTot); }
  y+=3;
  const noteTxt=[isAv && d.reason ? 'Motif : '+d.reason : '', d.notes].filter(Boolean).join('\n');
  if(noteTxt){ pdf.setTextColor(...ink); pdf.setFontSize(9); const nl=pdf.splitTextToSize(noteTxt, W-2*M); pdf.text(nl, M, y); y+=nl.length*4+4; }
  // conditions + RIB
  const cond=[];
  if(isAv){
    cond.push(`Cet avoir vient en déduction de la facture n° ${d.creditOfNumber||'—'}${d.creditOfDate?' du '+fdate(d.creditOfDate):''}.`);
    cond.push('Le montant sera remboursé ou déduit de votre prochain règlement.');
  } else if(isInv){
    cond.push('Conditions de règlement : '+termsLabel(p)+(!draft && d.dueDate ? ` (échéance le ${fdate(d.dueDate)})` : ''));
    if(p.paymentMode) cond.push('Mode de règlement : '+p.paymentMode);
    cond.push('Pas d’escompte pour paiement anticipé.');
    cond.push('Pénalités de retard : 3 fois le taux d’intérêt légal en vigueur.');
    if(ent) cond.push('Indemnité forfaitaire pour frais de recouvrement en cas de retard : 40 €.');
  } else {
    cond.push('Pour accepter ce devis, retournez-le signé avec la mention « Bon pour accord ».');
    if(d.depositRequested) cond.push(`Acompte demandé à la réservation : ${eur(d.depositRequested)}.`);
  }
  if(p.extraMentions) cond.push(p.extraMentions);
  const rib=[]; if(isInv && p.iban){ rib.push('IBAN : '+p.iban); if(p.bic) rib.push('BIC : '+p.bic); if(p.ibanHolder) rib.push('Titulaire : '+p.ibanHolder); }
  const cw = rib.length ? 104 : W-2*M;
  const condLines = cond.flatMap(s=>pdf.splitTextToSize(s, cw));
  if(y + condLines.length*4 + 16 > H-22){ pdf.addPage(); y=M; }
  pdf.setFont(FN,'bold'); pdf.setFontSize(10.5); pdf.setTextColor(...color); pdf.text('Conditions', M, y); if(rib.length) pdf.text('RIB', M+cw+8, y);
  y+=5; pdf.setFont(FN,'normal'); pdf.setFontSize(8.6); pdf.setTextColor(...ink);
  pdf.text(condLines, M, y); if(rib.length) pdf.text(rib, M+cw+8, y);
  y += Math.max(condLines.length, rib.length)*3.9 + 6;
  if(!isInv && !isAv){ if(y+30>H-22){ pdf.addPage(); y=M; } pdf.setDrawColor(200,203,214); pdf.setLineWidth(.3); pdf.roundedRect(W-M-80, y, 80, 28, 2, 2); pdf.setFontSize(8); pdf.setTextColor(...grey); pdf.text('Date, signature et « Bon pour accord »', W-M-77, y+5); }
  // pied de page
  const n = pdf.getNumberOfPages();
  for(let i=1;i<=n;i++){ pdf.setPage(i); pdf.setFont(FN,'normal'); pdf.setFontSize(8); pdf.setTextColor(...grey);
    pdf.text(docLabel, M, H-10); pdf.text(`Page ${i} sur ${n}`, W-M, H-10, {align:'right'});
    if(draft){ pdf.setTextColor(226,150,70); pdf.text('BROUILLON – sans valeur de facture', W/2, H-10, {align:'center'}); } }
  return pdf;
}
function hexToRgb(h){ const m=(h||'').replace('#','').match(/.{2}/g)||['30','46','c9']; return m.map(x=>parseInt(x,16)); }
function pdfName(d){ const c=docClient(d); const base = d.number || ((DOC_LABEL[d.type]||'Facture')+'-brouillon'); return `${base} ${clientName(c)}`.replace(/[\\/:*?"<>|]/g,'-')+'.pdf'; }
async function downloadPdf(d){
  let blob;
  try{ const f=await documentFile(d); blob=new Blob([f.bytes],{type:'application/pdf'}); }catch(e){ toast('Le PDF n’a pas pu être créé : '+e.message); return; }
  const dl = window.claude?.use ? await window.claude.use('downloads') : null;
  if(dl){ try{ await dl.save({filename:pdfName(d), data:blob}); toast('PDF enregistré'); }catch(e){ if(e.code!=='declined') toast('Téléchargement impossible ('+e.code+')'); } return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=pdfName(d); a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);

const FONTS = {ready:false, reg:'', bold:''};
async function ensureFonts(){
  if(FONTS.ready) return true;

    const b64 = async u => { const r=await fetch(u); if(!r.ok) throw new Error(u); const buf=new Uint8Array(await r.arrayBuffer());

      if(!(buf.length>1000 && ((buf[0]===0&&buf[1]===1&&buf[2]===0&&buf[3]===0) || String.fromCharCode(buf[0],buf[1],buf[2],buf[3])==='true'))) throw new Error('police invalide'); let s=''; for(let i=0;i<buf.length;i+=0x8000) s+=String.fromCharCode.apply(null, buf.subarray(i,i+0x8000)); return btoa(s); };

    FONTS.ready=true;
  }catch(e){ FONTS.ready=false; }
  return FONTS.ready;
}

/* Construit le fichier Factur-X (Uint8Array). Lance une erreur si la facture n'est pas prête. */
async function facturxBytes(d, opts={}){
  const issues=facturxIssues(d); if(issues.length) throw new Error(issues.join(' '));
  if(!await ensureFonts()) throw new Error('Police de caractères indisponible (connexion ?)');
  if(!window.PDFLib) throw new Error('Module PDF indisponible');
  const {PDFDocument, PDFName, PDFString, PDFHexString, AFRelationship, PDFHeader} = PDFLib;
  const base = pdfFor(d, {pdfa:true}).output('arraybuffer');
  const doc = await PDFDocument.load(base, {updateMetadata:false});
  const p=docProfile(d)||{}; const now=new Date(); now.setMilliseconds(0); const iso=now.toISOString().replace('.000','');
  const title=`${DOC_LABEL[d.type]||'Facture'} ${d.number}`, author=p.tradeName||p.ownerName||'';
  doc.setTitle(title,{showInWindowTitleBar:true}); doc.setAuthor(author); doc.setProducer('Cabine'); doc.setCreator('Cabine');
  doc.setCreationDate(now); doc.setModificationDate(now); doc.setSubject(''); doc.setKeywords([]);
  const ctx=doc.context;
  const info=ctx.lookup(ctx.trailerInfo.Info); ['Subject','Keywords'].forEach(k=>info.delete(PDFName.of(k)));
  const xmlBytes=new TextEncoder().encode(ciiXml(d, opts));
  await doc.attach(xmlBytes, 'factur-x.xml', {mimeType:'text/xml', description:'Factur-X invoice', creationDate:now, modificationDate:now, afRelationship:AFRelationship.Alternative});
  const meta=ctx.stream(new TextEncoder().encode(xmpFor(title, author, iso)), {Type:'Metadata', Subtype:'XML'});
  doc.catalog.set(PDFName.of('Metadata'), ctx.register(meta));
  const iccBytes=Uint8Array.from(atob(SRGB_ICC_B64), ch=>ch.charCodeAt(0));
  const icc=ctx.register(ctx.stream(iccBytes, {N:3}));
  const oi=ctx.obj({Type:'OutputIntent', S:'GTS_PDFA1', OutputConditionIdentifier:PDFString.of('sRGB IEC61966-2.1'), Info:PDFString.of('sRGB IEC61966-2.1'), DestOutputProfile:icc});
  doc.catalog.set(PDFName.of('OutputIntents'), ctx.obj([ctx.register(oi)]));
  doc.catalog.set(PDFName.of('MarkInfo'), ctx.obj({Marked:false}));
  if(!ctx.trailerInfo.ID){ const h=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join(''); ctx.trailerInfo.ID=ctx.obj([PDFHexString.of(h), PDFHexString.of(h)]); }
  ctx.header = PDFHeader.forVersion(1,7);
  return await doc.save({useObjectStreams:false, addDefaultPage:false, updateFieldAppearances:false});
}
/* Fichier à envoyer : Factur-X pour une facture numérotée prête, sinon PDF simple. */
async function documentFile(d){
  if(facturxApplies(d) && d.number && !facturxIssues(d).length){
    try{ return {bytes: await facturxBytes(d), facturx:true}; }catch(e){ console.warn('Factur-X', e); }
  }
  return {bytes: new Uint8Array(pdfFor(d).output('arraybuffer')), facturx:false};
}

// Codes de cycle de vie des factures électroniques (norme française)
const PA_STATUS = {200:'Déposée',201:'Émise',202:'Reçue par la plateforme du client',203:'Mise à disposition du client',204:'Prise en charge',205:'Approuvée',206:'Approuvée partiellement',207:'En litige',208:'Suspendue',209:'Complétée',210:'Refusée',211:'Paiement transmis',212:'Encaissée',213:'Rejetée',214:'Visée',220:'Annulée'};
const paCode = c => { const m=String(c||'').match(/\d{3}/); return m?Number(m[0]):null; };
const paLabel = c => PA_STATUS[paCode(c)] || (c ? String(c) : 'Envoyée');
const paTone = c => { const n=paCode(c); return [210,213,207,208].includes(n)?'late':[205,211,212,209].includes(n)?'paid':'due'; };
async function pacall(action, payload={}){
  if(!sb) throw new Error('Disponible uniquement sur la version installée');
  const {data,error} = await sb.functions.invoke('pa', {body:{action, ...payload}});
  if(error){ let msg=error.message; try{ const j=await error.context.json(); msg=j.error||msg; }catch(_){} throw new Error(msg); }
  return data;
}
let paEnv=null;
async function paEnvironment(){ if(!paEnv){ const st=await pacall('status'); paEnv={sandbox:!!st.sandbox, siren:st.company?.siren||''}; } return paEnv; }
async function sendToPA(d, silent){
  const cur = S.docs.find(x=>x.id===d.id) || d;
  if(cur.pa?.id && !cur.pa?.sandbox) { if(!silent) toast('Déjà transmise à la plateforme.'); return; }
  const iss = facturxIssues(cur); if(iss.length){ if(!silent) toast(iss.join(' ')); return; }
  try{
    const env = await paEnvironment();
    // bac à sable : la plateforme n'accepte que l'entreprise fictive du compte de test
    // bac à sable : vendeur = entreprise fictive du compte, client = entreprise fictive de test (000000001)
    // adresses de réception des entreprises fictives, d'après l'exemple fourni par SuperPDP
    const SANDBOX = {'000000002':'315143296_119041', '000000001':'315143296_119040'};
    const other = env.siren==='000000001' ? '000000002' : '000000001';
    const opts = env.sandbox && env.siren ? {sellerSiren:env.siren, sellerEndpoint:SANDBOX[env.siren]||env.siren, buyerSiren:other, buyerEndpoint:SANDBOX[other]} : {};
    const b64 = by => { let bin=''; for(let i=0;i<by.length;i+=0x8000) bin+=String.fromCharCode.apply(null, by.subarray(i,i+0x8000)); return btoa(bin); };
    const ext = env.sandbox ? cur.number+'-TEST-'+Date.now().toString(36) : cur.number;
    const client = clientById(cur.clientId);
    const sendXml = () => pacall('send', {base64:b64(new TextEncoder().encode(ciiXml(cur, opts))), contentType:'application/xml', externalId:ext});
    let r, format='facturx';
    if(client?.paFormat==='cii'){ r = await sendXml(); format='cii'; }
    else {
      try{ r = await pacall('send', {base64:b64(await facturxBytes(cur, opts)), externalId:ext}); }
      catch(e){
        // le destinataire n'accepte pas le Factur-X : même facture en XML CII seul
        if(!/does not accept this document/i.test(e.message)) throw e;
        r = await sendXml(); format='cii';
        if(client && !env.sandbox) await put('clients', {...client, paFormat:'cii'});
      }
    }
    const last = (r.events||[]).slice(-1)[0];
    const now = S.docs.find(x=>x.id===cur.id)||cur; const {paError, paErrorAt, ...clean} = now;
    await put('docs', {...clean, pa:{id:r.id, sandbox:env.sandbox, format, sentAt:new Date().toISOString(), status:last?.status_code||'fr:200', events:r.events||[]}});
    toast(env.sandbox ? `${cur.number} transmise à l’environnement de test` : `${cur.number} transmise à la plateforme agréée`);
  }catch(e){
    await put('docs', {...(S.docs.find(x=>x.id===cur.id)||cur), paError:e.message, paErrorAt:new Date().toISOString()});
    toast('Plateforme : '+(e.message==='pa_non_configuree'?'pas encore configurée (voir Plus > Plateforme agréée).':e.message));
  }
}
let paPulling=false;
async function pullPA(){
  if(backend.mode!=='supabase' || paPulling || !settings().paEnabled) return;
  const open_ = S.docs.filter(d=>d.pa?.id && ![210,212,213,220].includes(paCode(d.pa.status)));
  if(!open_.length) return; paPulling=true;
  try{
    const r = await pacall('events', {limit:100});
    for(const row of r.rows||[]){
      const d = S.docs.find(x=>x.pa?.id===row.id || (x.pa && x.number===row.number));
      if(!d || !row.events?.length) continue;
      const last=row.events[row.events.length-1];
      if(last.code===d.pa.status) continue;
      const upd={...d, pa:{...d.pa, status:last.code, events:row.events, updatedAt:new Date().toISOString()}};
      if(paCode(last.code)===212 && d.status!=='payee' && !d.pa.sandbox){ upd.status='payee'; upd.paidAt=(last.at||'').slice(0,10)||todayISO(); upd.paidAssumed=false; }
      await put('docs', upd);
      toast(`${d.number} : ${paLabel(last.code)}`);
    }
  }catch(e){ console.warn('PA', e); }
  paPulling=false;
}

/* ---------------- glisser à gauche / à droite (téléphone) ---------------- */
/* Renvoie une « ref » à poser sur l'élément : le geste se raccroche à chaque fois que l'élément change. */
function useSwipe(handlers){
  const h=useRef(handlers); h.current=handlers;
  const st=useRef({el:null, x0:null, y0:0, t0:0});
  const start=useRef(null), end=useRef(null);
  if(!start.current){
    start.current=e=>{
      const t=e.touches[0]; const w=window.innerWidth; const k=st.current;
      // pas dans un champ de saisie, ni depuis le bord de l'écran (geste « retour » du téléphone)
      if(e.touches.length>1 || e.target.closest('input,textarea,select,.no-swipe') || t.clientX<24 || t.clientX>w-24){ k.x0=null; return; }
      k.x0=t.clientX; k.y0=t.clientY; k.t0=Date.now();
    };
    end.current=e=>{
      const k=st.current; if(k.x0===null) return; const t=e.changedTouches[0]; const dx=t.clientX-k.x0, dy=t.clientY-k.y0; k.x0=null;
      if(Date.now()-k.t0>700 || Math.abs(dx)<60 || Math.abs(dy)>Math.abs(dx)*0.6) return;
      (dx<0 ? h.current.onLeft : h.current.onRight)?.();
    };
  }
  const refCb=useRef(null);
  if(!refCb.current) refCb.current = el=>{
    const k=st.current; if(k.el===el) return;
    if(k.el){ k.el.removeEventListener('touchstart',start.current); k.el.removeEventListener('touchend',end.current); }
    k.el=el;
    if(el){ el.addEventListener('touchstart',start.current,{passive:true}); el.addEventListener('touchend',end.current,{passive:true}); }
  };
  return refCb.current;
}

function docDate(d, basis){ return basis==='event' ? (d.eventDate||d.issueDate||(d.createdAt||'').slice(0,10)) : (d.issueDate||d.eventDate||(d.createdAt||'').slice(0,10)); }
function docHaystack(d){
  const c=docClient(d)||{}; const live=clientById(d.clientId)||{}; const t=computeTotals(d,docProfile(d));
  // mots-clés et nom actuels de la fiche client (la facture numérotée garde une copie figée du client)
  return norm([d.number, clientName(c), clientName(live), live.keywords, c.keywords, c.city, d.eventLocation, d.eventType, d.notes, ...(d.lines||[]).flatMap(l=>[l.title,l.description]),
    String(t.ttc).replace('.',','), String(Math.round(t.ttc)), docState(d).l].filter(Boolean).join(' '));
}
function periodPreset(k){
  const t=todayISO(), y=+t.slice(0,4), m=+t.slice(5,7);
  const pad=n=>String(n).padStart(2,'0'), last=(yy,mm)=>new Date(yy,mm,0).getDate();
  if(k==='month') return [`${y}-${pad(m)}-01`, `${y}-${pad(m)}-${last(y,m)}`];
  if(k==='prev'){ const yy=m===1?y-1:y, mm=m===1?12:m-1; return [`${yy}-${pad(mm)}-01`, `${yy}-${pad(mm)}-${last(yy,mm)}`]; }
  if(k==='quarter'){ const q=Math.floor((m-1)/3)*3+1; return [`${y}-${pad(q)}-01`, `${y}-${pad(q+2)}-${last(y,q+2)}`]; }
  if(k==='year') return [`${y}-01-01`, `${y}-12-31`];
  if(k==='lastyear') return [`${y-1}-01-01`, `${y-1}-12-31`];
  return ['',''];
}

    const dd=docDate(d,basis); if(from && (!dd || dd<from)) return false; if(to && (!dd || dd>to)) return false;

  }).sort((a,b)=>(docDate(b,basis)||'').localeCompare(docDate(a,basis)||'') || (b.number||'').localeCompare(a.number||''));
  const counted = list.filter(d=>d.status!=='annulee');
  const sum = counted.reduce((a,d)=>{ const t=computeTotals(d,docProfile(d)); return {ht:a.ht+t.ht, ttc:a.ttc+t.ttc}; },{ht:0,ttc:0});
  const filters = type==='facture' ? [['all','Toutes'],['draft','Brouillons'],['due','À encaisser'],['paid','Payées']] : type==='avoir' ? [['all','Tous'],['draft','Brouillons'],['paid','Émis']] : [['all','Tous'],['draft','Brouillons'],['due','Envoyés'],['accepted','Acceptés']];
  const presets=[['month','Ce mois'],['prev','Mois dernier'],['quarter','Ce trimestre'],['year','Cette année'],['lastyear','Année dernière']];
  const active = presets.find(([k])=>{ const [a,b]=periodPreset(k); return a===from && b===to; })?.[0] || (from||to?'custom':'all');
  const filtered = !!(q || from || to || filter!=='all');
  const anyVat = counted.some(d=>computeTotals(d,docProfile(d)).tva);
  return html`<div class="wrap">
    <div class="row sb"><h1>${type==='facture'?'Factures':type==='avoir'?'Avoirs':'Devis'}</h1>${type==='avoir' ? html`<span class="tiny" style="max-width:260px">Un avoir se crée depuis la facture à corriger : ouvrez-la puis « Créer un avoir ».</span>` : html`<button class="btn pri" onClick=${()=>open('doc',{doc:newDoc(type), isNew:true})}>${type==='facture'?'Nouvelle facture':'Nouveau devis'}</button>`}</div>
    <div class="row sb">
      <div class="seg">${[['facture','Factures'],['devis','Devis'],['avoir','Avoirs']].map(([k,l])=>html`<button class=${type===k?'on':''} onClick=${()=>{ setType(k); setFilter('all'); lsSet('cabine-doctype',k); }}>${l}</button>`)}</div>
      <div class="seg">${filters.map(([k,l])=>html`<button class=${filter===k?'on':''} onClick=${()=>setFilter(k)}>${l}</button>`)}</div>
    </div>

function PdfPreview({doc}){
  const box=useRef(null); const [err,setErr]=useState(''); const [busy,setBusy]=useState(true);
  const key = JSON.stringify(doc) + JSON.stringify(clientById(doc.clientId)||{}) + JSON.stringify(S.profiles.find(p=>p.id===doc.profileId)||{});
  useEffect(()=>{
    let cancel=false;
    const t=setTimeout(async()=>{
      if(!window.pdfjsLib){ setErr('L’aperçu n’a pas pu se charger. Utilisez le bouton PDF.'); setBusy(false); return; }
      try{
        setBusy(true);
        const data = pdfFor(doc).output('arraybuffer');
        const task = pdfjsLib.getDocument({data, isEvalSupported:false, disableFontFace:false});
        const pdf = await task.promise; if(cancel) return;
        const out=[]; const w = (box.current && box.current.clientWidth) || 560; const dpr = Math.min(2, window.devicePixelRatio||1);
        for(let i=1;i<=pdf.numPages;i++){
          const page=await pdf.getPage(i); const v0=page.getViewport({scale:1}); const vp=page.getViewport({scale:(w/v0.width)*dpr});
          const cv=document.createElement('canvas'); cv.width=Math.floor(vp.width); cv.height=Math.floor(vp.height);
          await page.render({canvasContext:cv.getContext('2d'), viewport:vp}).promise; out.push(cv);
        }
        if(!cancel && box.current){ box.current.replaceChildren(...out); setErr(''); }
        pdf.destroy();
      }catch(e){ if(!cancel) setErr('Aperçu impossible : '+e.message); }
      if(!cancel) setBusy(false);
    }, 300);
    return ()=>{ cancel=true; clearTimeout(t); };
  },[key]);
  return html`<div>${err && html`<div class="notice warn small">${err}</div>`}<div class="pdf-box" ref=${box} style=${busy?'opacity:.6':''}></div></div>`;
}

/* ---------------- reconnaissance des clients dans les titres d'agenda ---------------- */
const norm = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
// mots trop courants pour identifier un client
const STOP = new Set(['presta','prestation','prestations','soiree','soirees','dj','mix','set','live','rdv','bar','club','resto','restaurant','les','des','the','avec','pour','chez','fete','event','evenement','mariage','anniversaire','test']);
const clientTerms = c => [clientName(c), c.company, [c.firstName,c.lastName].filter(Boolean).join(' '), ...String(c.keywords||'').split(/[,;\n]/)]
  .map(norm).filter(k=>k.length>=3 && !STOP.has(k));
/* Trouve le client désigné dans un texte (« delicate », « Soirée Delicatessen »…). Renvoie null si aucun ou si deux clients se valent. */
function matchClient(text){
  const t=norm(text); if(!t) return null;
  const words=t.split(' ').filter(w=>w.length>=4 && !STOP.has(w));
  let best=null, bestScore=0, tie=false;
  for(const c of S.clients){
    let score=0;
    for(const k of clientTerms(c)){
      if((' '+t+' ').includes(' '+k+' ')) score=Math.max(score, 200+k.length);          // mot-clé ou nom complet présent
      else if(t.includes(k)) score=Math.max(score, 150+k.length);                       // collé à autre chose
      else if(t.length>=5 && (' '+k+' ').includes(' '+t+' ')) score=Math.max(score, 140+t.length); // morceau du nom : « espace loisirs »
      else if(t.length>=5 && k.startsWith(t)) score=Math.max(score, 130+t.length);       // début du nom : « live event »
      else for(const w of words){ if(k.split(' ').some(kw=>kw.length>=w.length && kw.startsWith(w))) score=Math.max(score, 100+w.length); } // début de mot : « delicate » → delicatessen
    }
    if(score>bestScore){ best=c; bestScore=score; tie=false; } else if(score && score===bestScore && c.id!==best?.id) tie=true;
  }
  return tie ? null : best;
}
/* Le titre désigne-t-il le client par son nom (« deli » → DELICATESSEN) ou par un mot-clé (« Vogue » → Complexe et loisirs) ? */
function matchedByName(c, text){
  const t=norm(text); const names=[clientName(c), c.company, [c.firstName,c.lastName].filter(Boolean).join(' ')].map(norm).filter(Boolean);
  const words=t.split(' ').filter(w=>w.length>=4 && !STOP.has(w));
  return names.some(n=>t.includes(n) || (t.length>=5 && n.includes(t)) || words.some(w=>n.split(' ').some(x=>x.startsWith(w))));
}
const cleanTitle = t => String(t||'').replace(/^rdv\s*[·:-]?\s*/i,'').trim();
/* Lieu proposé pour un événement Google rattaché au client c */
function placeFor(c, title, googleLocation){
  if(googleLocation) return googleLocation;
  if(c && !matchedByName(c, title)){                              // mot-clé = nom du lieu (« Vogue »)
    const last=lastLocationFor(c.id), kw=norm(cleanTitle(title));
    return last && kw && norm(last).includes(kw) ? last : cleanTitle(title);   // « cartel » → « Le Cartel » déjà connu
  }
  return c ? lastLocationFor(c.id) : cleanTitle(title);
}
function lastLocationFor(clientId){
  const ev=S.events.filter(e=>e.clientId===clientId && e.location).sort((a,b)=>b.date.localeCompare(a.date))[0];
  return ev?.location || lastInvoiceForClient(clientId)?.eventLocation || '';
}
/* Rattache après coup les dates venues de Google qui n'ont pas encore de client (nouveaux mots-clés, nouveau client…). */
async function rematchGoogleEvents(){
  let n=0;
  for(const e of S.events.filter(x=>x.fromGoogle && !x.clientId)){
    const c=matchClient((e.googleTitle||e.location||'')+' '+(e.googleLocation||'')); if(!c) continue;
    const upd={...e, clientId:c.id, location: placeFor(c, e.googleTitle||e.location||'', e.googleLocation) || e.location};
    if(c.monthlyBilling && e.kind!=='rdv'){ await detachEventInvoice(e); const re=await attachEventInvoice({...upd, invoiceId:''}); await put('events', re, {noSync:true}); n++; continue; }
    await put('events', upd, {noSync:true});
    const inv=S.docs.find(d=>d.id===e.invoiceId);
    if(inv && inv.status==='brouillon'){
      const prev=lastInvoiceForClient(c.id, inv.profileId);
      const blank=!(inv.lines||[]).some(l=>Number(l.unit)>0);
      await put('docs', {...inv, clientId:c.id, eventLocation:upd.location, ...(blank && prev ? {lines:refreshLines(prev.lines, e.date, upd.location), remisePct:prev.remisePct||0, notes:prev.notes||'', copiedFrom:prev.number||''} : {})});
    }
    n++;
  }
  return n;
}

/* ---------------- doublons Google Agenda / Cabine ---------------- */
async function findDuplicates(){
  const calId=settings().calendarId; const r=await gcall('scan'); const items=r.items||[];
  const day = g => parisParts(g.start, g.allDay).date;
  const out=[]; const seen=new Set();
  const add=(g,reason)=>{ const k=g.calendarId+'|'+g.id; if(seen.has(k)) return; seen.add(k); out.push({type:'google', g, reason, date:day(g)}); };
  // 1. plusieurs copies d'une même date Cabine dans l'agenda synchronisé
  const byCab={}; items.filter(g=>g.cabineId && g.calendarId===calId).forEach(g=>(byCab[g.cabineId]=byCab[g.cabineId]||[]).push(g));
  for(const [cid,list] of Object.entries(byCab)){ if(list.length<2) continue;
    const local=S.events.find(e=>e.id===cid);
    const keep=list.find(g=>g.id===local?.googleId) || list.slice().sort((a,b)=>(a.created||'').localeCompare(b.created||''))[0];
    list.filter(g=>g!==keep).forEach(g=>add(g,'Copie en double de la même date'));
  }

  items.filter(g=>g.cabineId && g.calendarId!==calId).forEach(g=>{ const local=S.events.find(e=>e.id===g.cabineId);
    add(g, local ? `Ancienne copie : la date est maintenant dans l’agenda synchronisé` : 'Date créée par Cabine, supprimée depuis'); });
  // 3. même date et même client qu'une date Cabine, dans un autre agenda

    const d=day(g); const c=matchClient(g.summary+' '+g.location);
    const twin=S.events.find(e=>e.date===d && ((c && e.clientId===c.id) || norm(g.summary)===norm(eventSummary(e))));
    if(twin) add(g, `Même date et même client que « ${eventSummary(twin)} »`);

  const groups={}; S.events.filter(e=>e.clientId).forEach(e=>{ const k=e.date+'|'+e.clientId+'|'+e.kind; (groups[k]=groups[k]||[]).push(e); });
  for(const list of Object.values(groups)){ if(list.length<2) continue;
    const score=e=>{ const inv=S.docs.find(d=>d.id===e.invoiceId); return (inv?.number?10:0)+(e.googleId?1:0); };
    const sorted=list.slice().sort((a,b)=>score(b)-score(a)); sorted.slice(1).forEach(e=>{ const inv=S.docs.find(d=>d.id===e.invoiceId);
      if(inv?.number) return; out.push({type:'cabine', e, reason:'Même date et même client qu’une autre date dans Cabine'+(inv?' (sa facture provisoire sera supprimée aussi)':''), date:e.date}); });
  }
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}

const OV = {cals:null, cache:{}, loading:{}};

async function overlayCalendars(){

/* Récupère les événements des autres agendas entre deux dates (AAAA-MM-JJ, incluses) ; résultat mis en cache 5 min. */
async function loadOverlay(from, to, force){
  const ids=overlayIds(); if(backend.mode!=='supabase' || !ids.length) return [];
  const key=ids.join(',')+'|'+from+'|'+to; const c=OV.cache[key];
  if(c && !force && Date.now()-c.at<5*60*1000) return c.items;
  if(OV.loading[key]) return OV.loading[key];
  OV.loading[key]=(async()=>{
    try{
      await overlayCalendars();
      const r=await gcall('overlay',{calendarIds:[...new Set(overlayIds())], timeMin:new Date(from+'T00:00:00').toISOString(), timeMax:new Date(addDays(to,1)+'T00:00:00').toISOString()});
      const cals=await overlayCalendars();
      const seenEv=new Set();
      const items=(r.items||[]).filter(e=>{ const k=e.id; if(seenEv.has(k)) return false; seenEv.add(k); return true; }).map(e=>{ const cal=cals.find(x=>x.id===e.calendarId)||{}; const s=parisParts(e.start,e.allDay), en=parisParts(e.end,e.allDay);
        const last = e.allDay ? addDays(en.date,-1) : (en.time==='00:00' && en.date>s.date ? addDays(en.date,-1) : en.date);
        return {...e, calName:cal.name||'', color:cal.color||'', date:s.date, lastDate:last<s.date?s.date:last, startTime:e.allDay?'':s.time, endTime:e.allDay?'':en.time}; });
      OV.cache[key]={at:Date.now(), items}; emit(); return items;
    }catch(e){ console.warn('Agendas Google', e); return []; }
    finally{ delete OV.loading[key]; }
  })();
  return OV.loading[key];
}
/* Un événement d'un autre agenda qui est en fait une date Cabine (copie ou même client le même jour) n'est pas affiché deux fois. */
function isTwinOfCabine(o){
  if(o.cabineId && S.events.some(e=>e.id===o.cabineId)) return true;
  const c=matchClient(o.summary+' '+(o.location||''));
  return S.events.some(e=>e.date===o.date && ((c && e.clientId===c.id) || norm(o.summary)===norm(eventSummary(e))));
}
function overlayByDate(items){
  const m={}; for(const e of (items||[]).filter(x=>!isTwinOfCabine(x))){ let d=e.date, n=0; while(d<=e.lastDate && n<62){ (m[d]=m[d]||[]).push(e); d=addDays(d,1); n++; } }
  Object.values(m).forEach(l=>l.sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||'')));
  return m;
}

}

function importAll(e){
  const file=e.target.files[0]; if(!file) return; const rd=new FileReader();
  rd.onload=async()=>{ try{ const j=JSON.parse(rd.result); const items=[]; for(const c of COLS) for(const o of (j[c]||[])) if(!S[c].some(x=>x.id===o.id)) items.push([c,o]);
    items.sort((a,b)=>(a[0]==='profiles')-(b[0]==='profiles')); toast('Import de '+items.length+' éléments…');
    for(const [c,o] of items){ let ok=false; for(let t=0;t<4&&!ok;t++){ try{ await backend.put(c,o); ok=true; }catch(err){ await new Promise(r=>setTimeout(r,800*(t+1))); } } if(ok && !S[c].some(x=>x.id===o.id)) S[c]=[...S[c],o]; }
    const p=S.profiles[0]; if(p && !activeProfile()) setActiveProfile(p.id); emit(); toast(items.length+' éléments importés'); }catch(err){ toast('Ce fichier n’est pas une sauvegarde valide.'); } };
  rd.readAsText(file);
}

function ImportCard({force}){
  useStore();
  const [state,setState]=useState({busy:false, done:0, total:0, msg:''});
  const [info,setInfo]=useState(null);
  const already = S.profiles.some(p=>p.id==='mathlows');
  useEffect(()=>{ if(already || (!force && lsGet('cabine-import-hidden')==='1')) return; fetch('import-mathlows.json').then(r=>r.ok?r.json():null).then(j=>setInfo(j)).catch(()=>{}); },[already]);
  if(already || !info || (!force && lsGet('cabine-import-hidden')==='1')) return null;
  async function run(){
    const items=[]; for(const c of COLS) for(const o of (info[c]||[])) if(!S[c].some(x=>x.id===o.id)) items.push([c,o]);
    setState({busy:true, done:0, total:items.length, msg:''});
    // le profil en dernier : la carte disparaît quand tout est importé
    items.sort((a,b)=>(a[0]==='profiles')-(b[0]==='profiles'));
    let done=0;
    for(const [c,o] of items){
      let ok=false, tries=0;
      while(!ok && tries<5){ try{ await backend.put(c,o); ok=true; }catch(e){ tries++; await new Promise(r=>setTimeout(r, 800*tries)); } }
      if(!ok){ setState(s=>({...s, busy:false, msg:'L’import s’est arrêté. Touchez à nouveau « Importer » pour reprendre là où il en était.'})); return; }
      const i=S[c].findIndex(x=>x.id===o.id); if(i<0) S[c]=[...S[c],o]; done++;
      if(done%10===0 || done===items.length){ setState(s=>({...s, done})); emit(); }
    }
    setActiveProfile('mathlows'); toast('Historique importé'); emit();
  }
  const nInv=(info.docs||[]).length, nCl=(info.clients||[]).length, nPr=(info.products||[]).length;
  return html`<div class="card stack" style="border-color:var(--accent)">
    <div style="font-weight:600">Votre historique MATHLOWS est prêt à être importé</div>
    <div class="small muted">1 profil, ${nCl} clients, ${nPr} produits du catalogue et ${nInv} factures (de ${fdate(info.docs[0]?.issueDate)} à ${fdate(info.docs[nInv-1]?.issueDate)}). La numérotation continuera à la suite : prochaine facture ${fmtNumber('F{AA}{MM}{NNNNN}', todayISO(), 1+Math.max(0,...info.docs.filter(d=>d.seqPeriod===todayISO().slice(0,7)).map(d=>d.seq)))}.</div>
    ${state.busy ? html`<div><div class="meter"><i style=${`width:${state.total?state.done/state.total*100:0}%`}></i></div><div class="tiny" style="margin-top:6px">${state.done} / ${state.total} éléments…</div></div>`
      : html`<div class="row"><button class="btn pri" onClick=${run}>Importer</button><button class="btn ghost" onClick=${()=>{ lsSet('cabine-import-hidden','1'); emit(); }}>Plus tard</button></div>`}
    ${state.msg && html`<div class="small" style="color:var(--bad)">${state.msg}</div>`}
  </div>`;
}

function mailTemplate(d){
  const c=docClient(d)||{}; const p=docProfile(d)||{}; const t=computeTotals(d,p);
  const hello = c.kind==='entreprise' ? (c.contact ? 'Bonjour '+c.contact.split(' ')[0]+',' : 'Bonjour,') : ('Bonjour'+(c.firstName?' '+c.firstName:'')+',');
  const what = d.type==='avoir' ? `l’avoir ${d.number} d’un montant de ${eur(t.ttc)}, qui vient en déduction de la facture ${d.creditOfNumber}` : d.type==='facture' ? `la facture ${d.number} d’un montant de ${eur(dueOf(d))}` : `le devis ${d.number} d’un montant de ${eur(t.ttc)}`;
  const presta = d.eventDate ? ` pour la prestation du ${fdate(d.eventDate)}${d.eventLocation?' ('+d.eventLocation+')':''}` : '';
  const pay = d.type==='facture' && d.dueDate ? `\n\nÉchéance de paiement : ${fdate(d.dueDate)}.${p.iban?' Règlement par virement (coordonnées bancaires sur la facture).':''}` : (d.type==='devis'?'\n\nN’hésitez pas à me contacter pour toute question. Pour valider, il suffit de me retourner le devis signé.':'');
  return {subject:`${DOC_LABEL[d.type]||'Facture'} ${d.number} – ${p.tradeName||p.ownerName||''}`.trim(),
    text:`${hello}\n\nVeuillez trouver ci-joint ${what}${presta}.${pay}\n\nMerci pour votre confiance,\n${p.ownerName||''}${p.tradeName?'\n'+p.tradeName:''}${p.phone?'\n'+p.phone:''}`};
}
function SendSheet({doc, onClose}){
  const c=docClient(doc)||{}; const tpl=mailTemplate(doc);
  const [f,setF,b]=useForm({to:c.email||'', subject:tpl.subject, text:tpl.text});
  const [busy,setBusy]=useState(false);
  async function send(){
    if(!f.to){ toast('Indiquez l’adresse du destinataire.'); return; }
    setBusy(true);
    try{
      const f = await documentFile(doc); let bin=''; for(let i=0;i<f.bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null, f.bytes.subarray(i,i+0x8000));
      const base64 = btoa(bin);
      const p=docProfile(doc)||{};
      await gcall('send',{to:f.to, subject:f.subject, text:f.text, fromName:p.tradeName||p.ownerName||'', attachments:[{filename:pdfName(doc), base64}]});
      const cur=S.docs.find(x=>x.id===doc.id)||doc;
      await put('docs',{...cur, sentAt:new Date().toISOString(), sentTo:f.to});
      if(c.id && !c.email && clientById(c.id)) await put('clients',{...clientById(c.id), email:f.to});
      toast('E-mail envoyé à '+f.to); onClose();
    }catch(e){ toast(e.message==='google_not_connected' ? 'Reconnectez votre compte Google (Plus > Se déconnecter, puis se reconnecter).' : 'Envoi impossible : '+e.message); setBusy(false); }
  }
  return html`<${Sheet} title="Envoyer par e-mail" onClose=${onClose} actions=${html`<button class="btn pri sm" onClick=${send} disabled=${busy}>${busy?'Envoi…':'Envoyer'}</button>`}>
    <div class="fields">

}

  if(!b) return null; const f=b.form||{}; const st=settings(); const dur=Number(st.booking?.duration)||60;
  const answers = [['Type',f.kind==='entreprise'?'Entreprise':'Particulier'],['Société',f.company],['SIRET',f.siret],['Nom',[f.firstName,f.lastName].filter(Boolean).join(' ')],['Adresse',[f.address,[f.cp,f.city].filter(Boolean).join(' ')].filter(Boolean).join(', ')],['E-mail',f.email],['Téléphone',f.phone],['Événement',f.eventType],['Date prévue',f.eventDate&&fdate(f.eventDate)],['Lieu',f.eventLocation],['Invités',f.guests],['Musique',f.music],['Message',f.message]].filter(x=>x[1]);
  async function mail(to, subject, text){ try{ await gcall('send',{to, subject, text, fromName:activeProfile()?.tradeName||''}); }catch(e){ toast('E-mail non envoyé : '+e.message); } }
  async function accept(){
    setBusy(true);
    let client = S.clients.find(c=>c.email && f.email && c.email.toLowerCase()===f.email.toLowerCase());
    if(!client){ client={...emptyClient(), kind:f.kind==='entreprise'?'entreprise':'particulier', firstName:f.firstName||'', lastName:f.lastName||'', company:f.company||'', contact:f.kind==='entreprise'?[f.firstName,f.lastName].filter(Boolean).join(' '):'', siret:(f.siret||'').replace(/\s/g,''), siren:(f.siret||'').replace(/\s/g,'').slice(0,9), address:f.address||'', cp:f.cp||'', city:f.city||'', email:f.email||'', phone:f.phone||'', fromBooking:true}; await put('clients',client); }
    const s=parisParts(b.slot_start), e=parisParts(b.slot_end);
    const notes = ['Préparation du rendez-vous :', ...answers.filter(a=>!['Type','Société','SIRET','Nom','Adresse','E-mail','Téléphone'].includes(a[0])).map(a=>`• ${a[0]} : ${a[1]}`)].join('\n');
    await put('events',{id:uid(), kind:'rdv', profileId:activeProfile()?.id||'', clientId:client.id, date:s.date, start:s.time, end:e.time, eventType:f.eventType||'', location:st.booking?.place||'', notes, invoiceId:'', bookingId:b.id});
    await sb.from('booking_requests').update({status:'accepted'}).eq('id',b.id);
    await mail(f.email, 'Rendez-vous confirmé', `Bonjour ${f.firstName||bookingName(f)},\n\nJe vous confirme notre rendez-vous le ${fdt(b.slot_start)}${st.booking?.place?' ('+st.booking.place+')':''}.\n\nÀ très vite,\n${activeProfile()?.ownerName||''}`);
    toast('Rendez-vous validé et ajouté à l’agenda'); onClose();
  }
  async function propose(){
    const list=props.filter(x=>x.date&&x.time).map(x=>{ const st0=new Date(`${x.date}T${x.time}:00`); return {start:st0.toISOString(), end:new Date(st0.getTime()+dur*60000).toISOString()}; });
    if(!list.length){ toast('Ajoutez au moins un créneau.'); return; }
    setBusy(true);
    await sb.from('booking_requests').update({status:'proposed', proposals:list, slot_start:null, slot_end:null}).eq('id',b.id);
    await mail(f.email, 'Proposition de créneaux pour notre rendez-vous', `Bonjour ${f.firstName||bookingName(f)},\n\nLe créneau demandé n’est malheureusement pas disponible. Je vous propose :\n${list.map(x=>'• '+fdt(x.start)).join('\n')}\n\nChoisissez celui qui vous convient ici :\n${bookingLink('t='+b.token)}\n\nÀ bientôt,\n${activeProfile()?.ownerName||''}`);
    toast('Créneaux proposés au client'); onClose();
  }
  async function decline(){ setBusy(true); await sb.from('booking_requests').update({status:'declined'}).eq('id',b.id); await mail(f.email,'Votre demande de rendez-vous',`Bonjour ${f.firstName||bookingName(f)},\n\nJe ne suis malheureusement pas disponible pour ce rendez-vous. N’hésitez pas à refaire une demande sur un autre créneau :\n${bookingLink()}\n\nBien à vous,\n${activeProfile()?.ownerName||''}`); toast('Demande refusée'); onClose(); }
  return html`<${Sheet} title=${bookingName(f)} onClose=${onClose}>
    ${b.slot_start && html`<div class="card"><div class="tiny">Créneau ${f.picked?'choisi par le client':'demandé'}</div><div style="font-weight:600;font-size:1.05rem">${fdt(b.slot_start)}</div></div>`}
    <div class="list">${answers.map(([k,v])=>html`<div class="item"><div class="tiny" style="width:90px;flex:none">${k}</div><div class="grow" style="white-space:pre-wrap">${v}</div></div>`)}</div>
    ${b.status==='pending' && html`<div class="row"><button class="btn pri" disabled=${busy} onClick=${accept}>Valider ce créneau</button><button class="btn danger" disabled=${busy} onClick=${decline}>Refuser</button></div>`}
    <div class="sect"><div class="lab">${b.status==='proposed'?'Créneaux déjà proposés':'Proposer d’autres créneaux'}</div>
      ${b.status==='proposed' ? html`<div class="small">${(b.proposals||[]).map(x=>html`<div>• ${fdt(x.start)}</div>`)}</div><div class="tiny">En attente du choix du client.</div>` : html`
      ${props.map((x,i)=>html`<div class="row" style="flex-wrap:nowrap"><input class="inp" type="date" value=${x.date} onInput=${e=>setProps(p=>p.map((y,j)=>j===i?{...y,date:e.target.value}:y))}/><input class="inp" type="time" value=${x.time} onInput=${e=>setProps(p=>p.map((y,j)=>j===i?{...y,time:e.target.value}:y))}/></div>`)}
      <div class="row">${props.length<3 && html`<button class="btn ghost sm" onClick=${()=>setProps(p=>[...p,{date:'',time:''}])}>Ajouter un créneau</button>`}<button class="btn" disabled=${busy} onClick=${propose}>Envoyer la proposition</button></div>
      <div class="tiny">Le client reçoit un e-mail avec un lien pour choisir l’un de ces créneaux (durée : ${dur} min).</div>`}
    </div>
  <//>`;
}
const WD = [['1','Lundi'],['2','Mardi'],['3','Mercredi'],['4','Jeudi'],['5','Vendredi'],['6','Samedi'],['0','Dimanche']];
function BookingSettings({onClose}){
  const [f,setF]=useState(()=>{ const def={enabled:false, title:'Prendre rendez-vous avec '+(activeProfile()?.tradeName||''), intro:'Choisissez un créneau pour que nous parlions de votre événement.', place:'Téléphone ou visio', duration:45, noticeHours:24, horizonDays:30, weekly:{'1':[{from:'18:00',to:'20:00'}],'3':[{from:'18:00',to:'20:00'}]}};
    const cur=clone(settings().booking||{}); return {...def, ...cur, weekly:cur.weekly||def.weekly}; });
  const set=(k,v)=>setF(x=>({...x,[k]:v}));
  const setDay=(d,list)=>setF(x=>({...x, weekly:{...x.weekly, [d]:list}}));
  async function save(){
    const data={...f, calendarId:settings().calendarId||''};
    const {error}=await sb.from('booking_settings').upsert({user_id:backend.user.id, data, updated_at:new Date().toISOString()});
    if(error){ toast('Enregistrement impossible : '+error.message); return; }
    await saveSettings({booking:f}); toast('Disponibilités enregistrées'); onClose();
  }
  const link=bookingLink();
  return html`<${Sheet} title="Page de réservation" onClose=${onClose} actions=${html`<button class="btn pri sm" onClick=${save}>Enregistrer</button>`}>
    <label class="check"><input type="checkbox" checked=${f.enabled} onChange=${e=>set('enabled',e.target.checked)}/><span>Page de réservation active</span></label>
    <div class="card stack"><div class="tiny">Votre lien à envoyer aux clients (ou à mettre sur Instagram) :</div><div style="word-break:break-all;font-weight:600">${link}</div>
      <button class="btn sm" style="align-self:flex-start" onClick=${()=>navigator.clipboard.writeText(link).then(()=>toast('Lien copié'),()=>toast('Sélectionnez le lien pour le copier'))}>Copier le lien</button></div>
    <div class="fields">
      <${F} label="Titre de la page" full value=${f.title} onInput=${v=>set('title',v)}/>
      <${TA} label="Texte d’accueil" value=${f.intro} onInput=${v=>set('intro',v)}/>
      <${F} label="Lieu du rendez-vous" value=${f.place} onInput=${v=>set('place',v)}/>
      <${Sel} label="Durée d’un rendez-vous" value=${String(f.duration)} onChange=${v=>set('duration',Number(v))} options=${[['15','15 min'],['30','30 min'],['45','45 min'],['60','1 h'],['90','1 h 30']]}/>
      <${F} label="Délai minimum avant un rendez-vous (heures)" type="number" value=${f.noticeHours} onInput=${v=>set('noticeHours',v)}/>
      <${F} label="Réservable jusqu’à (jours à l’avance)" type="number" value=${f.horizonDays} onInput=${v=>set('horizonDays',v)}/>
    </div>
    <div class="sect"><div class="lab">Mes disponibilités chaque semaine</div>
      ${WD.map(([d,l])=>{ const list=f.weekly[d]||[]; return html`<div class="line-ed"><div class="row sb"><b>${l}</b><button class="btn ghost sm" onClick=${()=>setDay(d,[...list,{from:'18:00',to:'20:00'}])}>Ajouter une plage</button></div>
        ${list.length? list.map((r,i)=>html`<div class="row" style="flex-wrap:nowrap"><input class="inp" type="time" value=${r.from} onInput=${e=>setDay(d,list.map((x,j)=>j===i?{...x,from:e.target.value}:x))}/><span>à</span><input class="inp" type="time" value=${r.to} onInput=${e=>setDay(d,list.map((x,j)=>j===i?{...x,to:e.target.value}:x))}/><button class="btn ghost sm" onClick=${()=>setDay(d,list.filter((_,j)=>j!==i))}>Retirer</button></div>`) : html`<div class="tiny">Indisponible</div>`}</div>`; })}
      <div class="tiny">Les créneaux déjà occupés (dates de l’agenda, rendez-vous, événements de votre Google Agenda) ne sont jamais proposés.</div>
    </div>
  <//>`;
}
function GoogleCard(){
  useStore(); const st=settings(); const [cals,setCals]=useState(null); const [status,setStatus]=useState(null);
  useEffect(()=>{ gcall('status').then(setStatus).catch(e=>setStatus({connected:false, error:e.message})); gcall('calendars').then(r=>setCals(r.items)).catch(()=>setCals([])); },[]);
  async function createCal(){ try{ const r=await gcall('create-calendar',{name:'DJ'}); setCals(c=>[...(c||[]),{id:r.id,name:r.name}]); await saveSettings({calendarId:r.id, calendarSync:true}); toast('Agenda « DJ » créé'); syncAll(); }catch(e){ toast(e.message); } }
  async function syncAll(){ let n=0; for(const e of S.events.filter(x=>x.date>=addDays(todayISO(),-30))){ await pushEvent(e); n++; } await pullGoogle(); toast(n+' dates envoyées vers Google Agenda'); }
  return html`<div class="card stack"><h2>Google</h2>
    <div class="small">${status==null?'Vérification…': status.connected ? html`Connecté : <b>${status.email}</b> (Gmail et Agenda)` : html`<span style="color:var(--bad)">Google n’est pas relié (${status.error}). Déconnectez-vous puis reconnectez-vous.</span>`}</div>
    <label class="f">Agenda à synchroniser<select value=${st.calendarId||''} onChange=${e=>saveSettings({calendarId:e.target.value, calendarSync:!!e.target.value})}><option value="">— Aucun —</option>${(cals||[]).map(c=>html`<option value=${c.id}>${c.name}${c.primary?' (principal)':''}</option>`)}</select></label>
    <div class="row">${!(cals||[]).some(c=>c.name==='DJ') && html`<button class="btn sm" onClick=${createCal}>Créer un agenda « DJ »</button>`}${st.calendarId && html`<button class="btn sm" onClick=${syncAll}>Synchroniser maintenant</button>`}${st.calendarId && html`<button class="btn sm" onClick=${()=>open('dups')}>Rechercher les doublons</button>`}</div>
    <${OverlaySettings}/>
    <div class="tiny">Chaque date ajoutée dans Cabine apparaît dans cet agenda (titre : lieu · client). Une date ajoutée dans cet agenda depuis votre téléphone arrive dans Cabine avec sa facture brouillon. Le widget Google Agenda de votre Pixel affiche alors vos dates.</div>
  </div>`;
}

const NAV=[['accueil','Accueil',I.home],['agenda','Agenda',I.cal],['documents','Factures',I.doc],['clients','Clients',I.users],['plus','Plus',I.more]];
function App(){
  useStore();
  const [route,setRoute]=useState(location.hash.slice(1)||'accueil');
  useEffect(()=>{ const f=()=>{ setRoute(location.hash.slice(1)||'accueil'); window.scrollTo(0,0); }; addEventListener('hashchange',f); return ()=>removeEventListener('hashchange',f); },[]);
  const p=activeProfile();
  const views={accueil:HomeView, agenda:AgendaView, documents:DocsView, clients:ClientsView, plus:SettingsView, catalogue:CatalogView, profils:ProfilesView};
  const V=views[route]||HomeView;
  const navOn = k => route===k || (k==='plus' && ['catalogue','profils'].includes(route));
  if(backend.needLogin) return html`<div class="shell"><main class="main"><${Login}/></main><${Toast}/></div>`;
  const body = !S.profiles.length ? html`<${Onboarding}/>` : html`
    <div class="wrap" style="margin-bottom:-4px"><div class="topbar">
      <div class="brand mob"><span class="disc"></span>Cabine</div>
      <span class="chip"><span class="dot" style=${`background:${p?.color}`}></span>
        ${S.profiles.length>1 ? html`<select aria-label="Profil actif" value=${p?.id} onChange=${e=>setActiveProfile(e.target.value)}>${S.profiles.map(x=>html`<option value=${x.id}>${x.tradeName||x.ownerName}</option>`)}</select>` : html`<span>${p?.tradeName||p?.ownerName}</span>`}</span>
    </div>${backend.note && html`<div class="notice warn small" style="margin-top:10px">${backend.note}</div>`}</div>
    <${V}/>`;
  return html`<div class="shell">
    ${S.profiles.length>0 && html`<nav class="side"><div class="brand"><span class="disc"></span>Cabine</div>${NAV.map(([k,l,ic])=>html`<a href=${'#'+k} class=${navOn(k)?'on':''}>${ic}${l}</a>`)}<a href="#catalogue" class=${route==='catalogue'?'on':''}>${I.box}Catalogue</a><a href="#profils" class=${route==='profils'?'on':''}>${I.id}Profils</a></nav>`}
    <main class="main">${body}</main>
    ${S.profiles.length>0 && html`<nav class="tabs">${NAV.map(([k,l,ic])=>html`<a href=${'#'+k} class=${navOn(k)?'on':''}>${ic}${l}</a>`)}</nav>`}
    <${Sheets}/><${Toast}/>
  </div>`;
}
if(window.CABINE_CONFIG && 'serviceWorker' in navigator && !/claude\.ai|claudeusercontent/.test(location.hostname)){
  const l=document.createElement('link'); l.rel='manifest'; l.href='manifest.webmanifest'; document.head.appendChild(l);
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
/* Application installée : à l'ouverture et au retour sur l'appli, vérifier qu'on a bien la dernière version publiée. */
async function checkUpdate(){
  if(!window.CABINE_BUILD) return;
  try{
    const r=await fetch('version.json?t='+Date.now(), {cache:'no-store'}); if(!r.ok) return;
    const v=(await r.json()).build;
    if(v && v!==window.CABINE_BUILD){
      // rien n'est perdu : chaque modification est enregistrée au fur et à mesure
      if(!document.querySelector('.overlay')) location.reload();
      else toast('Une nouvelle version de Cabine est disponible : elle sera chargée à la prochaine ouverture.');
    }
  }catch(_){}
}
if(window.CABINE_BUILD){ setTimeout(checkUpdate, 2000); document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') checkUpdate(); }); }
ensureFonts();
initStore().then(()=>render(html`<${App}/>`, document.getElementById('app')));
</script>
