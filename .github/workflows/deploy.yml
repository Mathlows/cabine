name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  DB_PASSWORD_RAW: ${{ secrets.SUPABASE_DB_PASSWORD }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

jobs:
  backend:
    name: Base de données et fonctions (Supabase)
    runs-on: ubuntu-latest
    outputs:
      anon: ${{ steps.keys.outputs.anon }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la configuration
        run: |
          missing=""
          [ -z "$PROJECT_REF" ] && missing="$missing SUPABASE_PROJECT_REF(variable)"
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN(secret)"
          [ -z "${{ secrets.SUPABASE_DB_PASSWORD }}" ] && missing="$missing SUPABASE_DB_PASSWORD(secret)"
          if [ -n "$missing" ]; then echo "::error::Il manque :$missing"; exit 1; fi
          # retire les espaces copiés par erreur avant ou après le mot de passe
          PW="$(printf '%s' "$DB_PASSWORD_RAW" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          echo "::add-mask::$PW"
          echo "DB_PASSWORD=$PW" >> "$GITHUB_ENV"
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Relier le projet
        run: supabase link --project-ref "$PROJECT_REF" -p "$DB_PASSWORD"
      - name: Créer ou mettre à jour les tables
        run: supabase db push --remote -p "$DB_PASSWORD" --yes
      - name: Clés Google pour les fonctions
        if: env.GOOGLE_CLIENT_ID != ''
        run: supabase secrets set --project-ref "$PROJECT_REF" GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"
      - name: Déployer les fonctions
        run: |
          supabase functions deploy google --project-ref "$PROJECT_REF"
          supabase functions deploy booking --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Connexion avec Google (réglages d'authentification)
        if: env.GOOGLE_CLIENT_ID != ''
        run: |
          SITE="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          curl -sS --fail-with-body -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"site_url\":\"$SITE\",\"uri_allow_list\":\"$SITE**\",\"external_google_enabled\":true,\"external_google_client_id\":\"$GOOGLE_CLIENT_ID\",\"external_google_secret\":\"$GOOGLE_CLIENT_SECRET\"}" > /dev/null
          echo "Adresse du site : $SITE"
      - name: Lire la clé publique du projet
        id: keys
        run: |
          ANON=$(curl -sS --fail-with-body "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '.[] | select(.name=="anon") | .api_key')
          echo "anon=$ANON" >> "$GITHUB_OUTPUT"

  site:
    name: Site (GitHub Pages)
    needs: backend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer les fichiers
        run: |
          mkdir -p _site
          {
            echo '<!doctype html><html lang="fr"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
            echo '<meta name="theme-color" content="#3046c9"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">'
            echo '<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>'
            echo "<script>window.CABINE_CONFIG={supabaseUrl:'https://${PROJECT_REF}.supabase.co',supabaseAnonKey:'${{ needs.backend.outputs.anon }}'};</script>"
            echo '</head><body>'
            cat index.html
            echo '</body></html>'
          } > _site/index.html
          cp reserver.html _site/
          cp web/* _site/
          echo "window.CABINE_CONFIG={supabaseUrl:'https://${PROJECT_REF}.supabase.co',supabaseAnonKey:'${{ needs.backend.outputs.anon }}'};" > _site/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
