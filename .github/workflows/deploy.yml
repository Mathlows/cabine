name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  DB_PASSWORD_RAW: ${{ secrets.SUPABASE_DB_PASSWORD }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  SUPERPDP_CLIENT_ID: ${{ secrets.SUPERPDP_CLIENT_ID }}
  SUPERPDP_CLIENT_SECRET: ${{ secrets.SUPERPDP_CLIENT_SECRET }}
  SUPERPDP_API_URL: ${{ vars.SUPERPDP_API_URL }}
  SUPERPDP_AUTH_URL: ${{ vars.SUPERPDP_AUTH_URL }}

jobs:
  backend:
    name: Base de données et fonctions (Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la configuration
        run: |
          missing=""
          [ -z "$PROJECT_REF" ] && missing="$missing SUPABASE_PROJECT_REF(variable)"
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN(secret)"
          [ -z "${{ secrets.SUPABASE_DB_PASSWORD }}" ] && missing="$missing SUPABASE_DB_PASSWORD(secret)"
          if [ -n "$missing" ]; then echo "::error::Il manque :$missing"; exit 1; fi
          # retire les espaces copiés par erreur avant ou après le mot de passe
          PW="$(printf '%s' "$DB_PASSWORD_RAW" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          echo "::add-mask::$PW"
          echo "DB_PASSWORD=$PW" >> "$GITHUB_ENV"
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Relier le projet
        run: supabase link --project-ref "$PROJECT_REF" -p "$DB_PASSWORD"
      - name: Créer ou mettre à jour les tables
        run: supabase db push --remote -p "$DB_PASSWORD" --yes
      - name: Clés Google pour les fonctions
        if: env.GOOGLE_CLIENT_ID != ''
        run: supabase secrets set --project-ref "$PROJECT_REF" --yes GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"
      - name: Clés de la plateforme agréée (SuperPDP)
        if: env.SUPERPDP_CLIENT_ID != ''
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" --yes SUPERPDP_CLIENT_ID="$SUPERPDP_CLIENT_ID" SUPERPDP_CLIENT_SECRET="$SUPERPDP_CLIENT_SECRET"
          supabase secrets set --project-ref "$PROJECT_REF" --yes SUPERPDP_API_URL="${SUPERPDP_API_URL:-https://api.superpdp.tech/v1.beta}" SUPERPDP_AUTH_URL="${SUPERPDP_AUTH_URL:-https://api.superpdp.tech/oauth2/token}"
      - name: Tester la connexion à la plateforme (sans afficher de données)
        if: env.SUPERPDP_CLIENT_ID != ''
        run: |
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          CID="$(trim "$SUPERPDP_CLIENT_ID")"; CSE="$(trim "$SUPERPDP_CLIENT_SECRET")"
          echo "::add-mask::$CID"; echo "::add-mask::$CSE"
          [ "$CID" != "$SUPERPDP_CLIENT_ID" ] && echo "Note : l'identifiant contenait des espaces ou retours à la ligne"
          [ "$CSE" != "$SUPERPDP_CLIENT_SECRET" ] && echo "Note : le secret contenait des espaces ou retours à la ligne"
          echo "Longueurs : identifiant ${#CID} caractères, secret ${#CSE} caractères"
          URL=${SUPERPDP_AUTH_URL:-https://api.superpdp.tech/oauth2/token}; echo "Adresse de connexion : $URL"
          A=$(curl -sS -o /tmp/a.json -w "%{http_code}" -X POST $URL -H "Content-Type: application/x-www-form-urlencoded" --data-urlencode grant_type=client_credentials --data-urlencode "client_id=$CID" --data-urlencode "client_secret=$CSE")
          echo "Méthode 1 (identifiants dans le formulaire) : HTTP $A — motif : $(jq -r '.error // empty' /tmp/a.json 2>/dev/null) $(jq -r '.error_description // empty' /tmp/a.json 2>/dev/null | cut -c1-120)"
          B=$(curl -sS -o /tmp/b.json -w "%{http_code}" -X POST $URL -u "$CID:$CSE" -H "Content-Type: application/x-www-form-urlencoded" --data-urlencode grant_type=client_credentials)
          echo "Méthode 2 (identifiants en en-tête) : HTTP $B — motif : $(jq -r '.error // empty' /tmp/b.json 2>/dev/null) $(jq -r '.error_description // empty' /tmp/b.json 2>/dev/null | cut -c1-120)"
          for F in /tmp/a.json /tmp/b.json; do
            if jq -e .access_token $F >/dev/null 2>&1; then
              TOK=$(jq -r .access_token $F); echo "::add-mask::$TOK"
              ME=$(curl -sS -o /tmp/me.json -w "%{http_code}" "${SUPERPDP_API_URL:-https://api.superpdp.tech/v1.beta}/companies/me" -H "Authorization: Bearer $TOK")
              echo "Accès au compte entreprise ($F) : HTTP $ME — $(jq -r '.error.message // .message // .error // empty' /tmp/me.json 2>/dev/null | cut -c1-160)"
              echo "Champs du compte : $(jq -r 'keys | join(", ")' /tmp/me.json 2>/dev/null)"
              echo "Indicateurs d'environnement : $(jq -c '[paths(scalars) as $p | select(($p|map(tostring)|join(".")|test("sandbox|env|mode|live|test";"i"))) | {($p|map(tostring)|join(".")): getpath($p)}]' /tmp/me.json 2>/dev/null)"
              if jq -e '.env=="sandbox"' /tmp/me.json >/dev/null 2>&1; then
                T=$(curl -sS -o /tmp/ti.out -w "%{http_code} %{content_type}" "${SUPERPDP_API_URL:-https://api.superpdp.tech/v1.beta}/invoices/generate_test_invoice" -H "Authorization: Bearer $TOK")
                echo "Facture de test fournie par le bac à sable : HTTP $T"
                echo "Identifiants trouvés dans l'exemple (entreprises fictives) :"
                grep -oE 'schemeID="[0-9A-Z]+">[^<]{1,40}<|"(scheme|electronic_address|identifier|scheme_id|value|number)"[[:space:]]*:[[:space:]]*"[^"]{1,40}"' /tmp/ti.out | sort -u | head -20
                echo "Rôles dans l'exemple : $(grep -oE '<ram:(SellerTradeParty|BuyerTradeParty)>|"(seller|buyer)"' /tmp/ti.out | sort | uniq -c | tr '\n' ' ')"
                head -c 1500 /tmp/ti.out | tr '\n' ' ' | sed 's/IBAN[^<]*//g'; echo
                rm -f /tmp/ti.out
              fi
              break
            fi
          done
          rm -f /tmp/a.json /tmp/b.json /tmp/me.json
      - name: Déployer les fonctions
        run: |
          supabase functions deploy google --project-ref "$PROJECT_REF" --yes
          supabase functions deploy booking --project-ref "$PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy pa --project-ref "$PROJECT_REF" --yes
      - name: Connexion avec Google (réglages d'authentification)
        if: env.GOOGLE_CLIENT_ID != ''
        run: |
          SITE="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          curl -sS --fail-with-body -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"site_url\":\"$SITE\",\"uri_allow_list\":\"$SITE**\",\"external_google_enabled\":true,\"external_google_client_id\":\"$GOOGLE_CLIENT_ID\",\"external_google_secret\":\"$GOOGLE_CLIENT_SECRET\"}" > /dev/null
          echo "Adresse du site : $SITE"

  site:
    name: Site (GitHub Pages)
    needs: backend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer les fichiers
        run: |
          KEYS=$(curl -sS --fail-with-body "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=true" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          ANON=$(echo "$KEYS" | jq -r '[.[] | select(.name=="anon")][0].api_key // empty')
          [ -z "$ANON" ] && ANON=$(echo "$KEYS" | jq -r '[.[] | select(.type=="publishable")][0].api_key // empty')
          if [ -z "$ANON" ]; then echo "::error::Clé publique Supabase introuvable"; exit 1; fi
          mkdir -p _site
          {
            echo '<!doctype html><html lang="fr"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
            echo '<meta name="theme-color" content="#3046c9"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">'
            echo '<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>'
            echo "<script>window.CABINE_CONFIG={supabaseUrl:'https://${PROJECT_REF}.supabase.co',supabaseAnonKey:'${ANON}'};</script>"
            echo '</head><body>'
            cat index.html
            echo '</body></html>'
          } > _site/index.html
          cp reserver.html _site/
          cp -r web/. _site/
          echo "window.CABINE_CONFIG={supabaseUrl:'https://${PROJECT_REF}.supabase.co',supabaseAnonKey:'${ANON}'};" > _site/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
